# Deep Research Agent —— Docker Compose 编排
#
# 启动 Web 界面：
#   docker compose up -d
#   浏览器打开 http://localhost:8501
#
# 跑一次命令行研究：
#   docker compose run --rm cli "2024 年以来国产大模型的推理成本下降了大约多少？"
#
# 跑策略消融评估：
#   docker compose run --rm eval
#
# ---------------------------------------------------------------------------
# ⚠️ 国内网络必读：基础镜像怎么拉
#
# 实测 registry-1.docker.io / auth.docker.io / hub.docker.com 全部不可达，
# 所以 `docker build` 会因为拉不到 python:3.11-slim 而失败。两种解决办法：
#
#   方案一（推荐）：给 Docker 配置镜像加速站
#     编辑 Docker Desktop → Settings → Docker Engine，加入：
#       { "registry-mirrors": ["https://docker.1panel.live"] }
#     重启 Docker 后正常 `docker compose up -d --build` 即可。
#
#   方案二：先手动拉取并改标签
#     docker pull docker.1panel.live/library/python:3.11-slim
#     docker tag  docker.1panel.live/library/python:3.11-slim python:3.11-slim
#
# 说明：`cli` 与 `eval` 放在 profile 里，`docker compose up` 不会顺带启动它们。
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: .
      args:
        # 国内构建时走清华 PyPI 镜像；海外环境可改成 https://pypi.org/simple
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: deep-research-agent:latest
    container_name: deep-research-agent
    env_file:
      - .env
    environment:
      # 容器内要把结果落到挂载出来的目录，所以显式指定
      TZ: Asia/Shanghai
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      - "8501:8501"
    volumes:
      # 密钥与配置留在宿主机，不进镜像
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./results:/app/results
      # 向量索引与模型缓存持久化，避免每次重建
      - ./chroma_db:/app/chroma_db
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---- 命令行入口（按需运行）----
  cli:
    profiles: ["cli"]
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: deep-research-agent:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./results:/app/results
      - ./chroma_db:/app/chroma_db
      - hf_cache:/root/.cache/huggingface
    entrypoint: ["python", "main.py"]
    # 用法：docker compose run --rm cli "你的研究问题" --max-iter 3

  # ---- 环境体检（排查配置问题）----
  doctor:
    profiles: ["cli"]
    image: deep-research-agent:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - hf_cache:/root/.cache/huggingface
    entrypoint: ["python", "main.py", "--doctor"]

  # ---- 策略消融评估 ----
  eval:
    profiles: ["cli"]
    image: deep-research-agent:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./results:/app/results
      - ./chroma_db:/app/chroma_db
      - hf_cache:/root/.cache/huggingface
    entrypoint: ["python", "eval_research.py"]

volumes:
  # 模型缓存单独放一个具名卷：HuggingFace 模型下载一次就能复用
  hf_cache:
